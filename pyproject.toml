[project]
name="repo-pilot"
version="0.1.0"
requires-python=">=3.11"
dependencies=[
    "typer>=0.12.0",
    "pytest>=0.8.0",
    "httpx>=0.27,<1",
]

[project.scripts]
repo-pilot="repo_pilot.cli:app"

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]