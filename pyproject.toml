[project]
name="repo-pilot"
version="0.2.0"
requires-python=">=3.11"
dependencies=[
  "typer>=0.12.0",
  "pytest>=8.0.0",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
]

[project.scripts]
repo-pilot="repo_pilot.cli:app"

[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[tool.setuptools.packages.find]
where=["src"]
